name: Release
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  # Release gate: the FULL suite (including the end-to-end smoke) must pass
  # before anything is packaged (sweep-5 finding: the release pipeline did not
  # run the tests).
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  build:
    needs: test
    # Windows-only: the packer currently stages the WINDOWS chonkllama engine
    # build (see docs/RELEASE.md known issues - Linux/macOS staging is roadmap).
    runs-on: windows-latest
    env:
      # Secret must point at a zip containing the pinned chonkllama build
      # (llama-server.exe, llama-tts.exe, DLLs, mtmd.dll).
      ENGINE_URL: ${{ secrets.ENGINE_URL }}
    steps:
      - name: No engine source configured - skip packaging (notice, not failure)
        if: env.ENGINE_URL == ''
        run: |
          echo "::notice::ENGINE_URL secret is not set - CI packaging skipped. For this alpha, release the locally verified 'npm run pack:dir' artifacts (dist/win-unpacked) whose hashes are in the release notes. Set the ENGINE_URL secret to a pinned chonkllama zip to enable CI-built installers."
      - uses: actions/checkout@v4
        if: env.ENGINE_URL != ''
      - uses: actions/setup-node@v4
        if: env.ENGINE_URL != ''
        with:
          node-version: 22
      - run: npm ci
        if: env.ENGINE_URL != ''
      - name: Download the pinned engine build
        if: env.ENGINE_URL != ''
        run: |
          Invoke-WebRequest -Uri "$env:ENGINE_URL" -OutFile "$env:RUNNER_TEMP\engine.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\engine.zip" -DestinationPath "$env:RUNNER_TEMP\engine-src" -Force
          $src = (Resolve-Path "$env:RUNNER_TEMP\engine-src").Path
          if (-not (Test-Path "$src\llama-server.exe")) { throw "staged engine source has no llama-server.exe - refusing to package an empty engine" }
          "EH_ENGINE_SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Stage + verify the bundled engine (SHA256 manifest)
        if: env.ENGINE_URL != ''
        run: |
          node scripts/prepare-engine.mjs
          node scripts/prepare-engine.mjs --verify
      - run: npm run build
        if: env.ENGINE_URL != ''
      - name: Package (Windows NSIS)
        if: env.ENGINE_URL != ''
        run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        if: env.ENGINE_URL != ''
        with:
          name: event-horizon-windows
          path: dist/*
          if-no-files-found: error
