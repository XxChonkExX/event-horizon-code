name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Full suite (typecheck + 10 test stages + end-to-end smoke). The smoke boots
    # the real runtime including native modules, so plain `npm ci` (no
    # --ignore-scripts) is required.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Electron shared libraries (headless-runner ABI)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libgbm1 libnss3 libasound2 libxss1 libxtst6 xvfb
      - run: npm ci
      - run: npm test
