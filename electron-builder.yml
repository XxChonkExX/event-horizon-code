appId: com.eventhorizon.code
productName: Event Horizon Code
icon: build/icon.png
directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json
  - languages/**/*
  - engrams/**/*
  - skills/**/*
  - "!**/*.{ts,tsx,map}"
  - "!src"
  - "!scripts"
  - "!docs"
  - "!**/.git*"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/*.d.ts"
  - "!**/node_modules/.bin"

asar: true
# Native bindings must live outside the asar archive or Node cannot load them.
asarUnpack:
  - "**/*.node"
  - "**/*.dll"

# Bundled inference engine (chonkllama.cpp chonk-buffer + VulkanVM Chonk Buffer).
# Populated at packaging time from pinned chonkllama release binaries (SHA-verified).
# Templates + language packs land next to the executable: chatTemplates.ts and
# lsp.ts look in <execDir>/resources first and fall back to the process cwd -
# which is the user's arbitrary cwd in an installed app, so these MUST ship as
# extraResources for packaged builds to keep tool-calling templates and the LSP.
extraResources:
  - from: resources/engine
    to: engine
    filter: ["**/*"]
  - from: resources/templates
    to: templates
    filter: ["**/*"]
  - from: languages
    to: languages
    filter: ["**/*"]

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  # Unsigned alpha (operator decision 2026-11-26): GitHub-hosted macOS CI
  # builds .dmg/.zip with no signing identity and no notarization - Gatekeeper
  # requires right-click > Open. Set an identity + notarize credentials here
  # (or via env) when an Apple Developer account exists.
  notarize: false
  target:
    - dmg
    - zip

win:
  # NSIS + MSI. MSI needs the real .ico in build/ (WiX LGHT0094 without it).
  target:
    - nsis
    - msi
  icon: build/icon.png
  artifactName: "${productName}-${version}-${arch}.${ext}"

linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Development;IDE;

publish: null
# Local side files (operator decision 2026-11-26): "Open With" and
# double-click open the file in the workbench editor (per-user registration;
# no admin required). The main process guards what it opens - credential
# files and binaries are refused there.
fileAssociations:
  - { ext: yaml, name: "Event Horizon Code", description: "Open in Event Horizon Code", role: Editor }
  - { ext: yml, name: "Event Horizon Code", description: "Open in Event Horizon Code", role: Editor }
  - { ext: json, name: "Event Horizon Code", description: "Open in Event Horizon Code", role: Editor }
